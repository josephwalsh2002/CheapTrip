<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CheapTrip Europe</title><style>body{font-family:Arial;max-width:900px;margin:auto;padding:24px;background:#f5f7fb;color:#172033}.card{background:#fff;padding:24px;border-radius:16px;margin-bottom:20px;box-shadow:0 4px 18px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}label{font-weight:bold;display:block;margin-bottom:6px}input,select,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3df;border-radius:10px;font-size:16px}button{background:#172033;color:#fff;cursor:pointer;margin-top:18px}pre{white-space:pre-wrap;word-break:break-word;background:#101827;color:#e8eef8;padding:16px;border-radius:10px}</style></head><body><div class="card"><h1>✈️ CheapTrip Europe</h1><p>Search flights with your Duffel test account.</p><div class="grid"><div><label>From (IATA)</label><input id="o" placeholder="DUB" maxlength="3"></div><div><label>To (IATA)</label><input id="d" placeholder="CDG" maxlength="3"></div><div><label>Departure</label><input id="dep" type="date"></div><div><label>Return (optional)</label><input id="ret" type="date"></div><div><label>Travellers</label><input id="a" type="number" min="1" value="1"></div><div><label>Cabin</label><select id="c"><option>economy</option><option>premium_economy</option><option>business</option><option>first</option></select></div></div><button onclick="go()">Search Flights</button><p id="s"></p></div><div class="card"><h2>Results</h2><pre id="r">Enter airports and dates, then search.</pre></div><script>async function go(){s.textContent="Searching...";try{let b={origin:o.value,destination:d.value,departureDate:dep.value,returnDate:ret.value||undefined,adults:+a.value||1,cabinClass:c.value};let x=await fetch("/api/flights/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}),j=await x.json();if(!x.ok)throw Error(j.error||"Search failed");s.textContent="Search completed.";r.textContent=JSON.stringify(j,null,2)}catch(e){s.textContent="Search error";r.textContent=e.message}}</script></body></html>
